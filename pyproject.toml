[project]
name = "mcp-base"
version = "0.1.0"
description = "Base pédagogique MCP & AI Tools — Tutoriels progressifs + serveurs production-ready"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Borne haute volontaire : ce dépôt enseigne FastMCP (API mcp 1.x). En mcp 2.x,
    # `mcp.server.fastmcp` a été renommé `mcp.server.mcpserver` (FastMCP -> MCPServer)
    # et `langchain-mcp-adapters` importe encore l'ancien chemin — sans cette borne,
    # une installation neuve résout mcp 2.x et casse la collecte pytest.
    # Migration vers 2.x : https://py.sdk.modelcontextprotocol.io/v2/migration/
    "mcp[cli]>=1.8.0,<2",
]

[project.optional-dependencies]
web = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]
anthropic = [
    "anthropic>=0.40",
]
langchain = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tutorials", "servers", "clients"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tutorials/*/__init__.py" = ["N999"]
